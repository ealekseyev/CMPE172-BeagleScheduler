<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technician Dashboard — BeagleScheduler</title>
  <link rel="stylesheet" th:href="@{/css/beagle.css}">
</head>
<body>

<nav class="bs-nav">
  <a class="bs-nav-brand" href="/">BeagleScheduler</a>
  <div class="bs-nav-links">
    <a class="bs-nav-link active" href="/technician/dashboard">My Work</a>
    <form th:action="@{/logout}" method="post" style="display:inline;margin:0;">
      <button type="submit" class="bs-nav-link" style="background:none;border:none;cursor:pointer;">Sign out</button>
    </form>
  </div>
</nav>

<div class="page-wide">
  <h2 class="section-heading">Technician Dashboard</h2>
  <p class="section-sub">
    Assigned appointments for
    <strong th:text="${techName}">you</strong>.
    Mark machines ready once serviced.
  </p>

  <div th:if="${#lists.isEmpty(appointments)}" class="empty-state">
    <h3>No assignments yet</h3>
    <p>You have no appointments assigned at the moment.</p>
  </div>

  <div th:unless="${#lists.isEmpty(appointments)}" class="table-wrap">
    <table class="bs-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>Machine</th>
          <th>Model</th>
          <th>Start</th>
          <th>End</th>
          <th>Days</th>
          <th>Total</th>
          <th>Status</th>
          <th>Machine Ready</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="appt : ${appointments}">
          <td th:text="${appt.appointmentId}"></td>
          <td>
            <span class="slot-machine" th:text="${appt.customerName}"></span>
          </td>
          <td th:text="${appt.serialNumber}"></td>
          <td><span class="slot-model" th:text="${appt.modelName}"></span></td>
          <td th:text="${appt.startDate}"></td>
          <td th:text="${appt.endDate}"></td>
          <td th:text="${appt.durationDays}"></td>
          <td><strong th:text="'$' + ${#numbers.formatDecimal(appt.totalCost, 1, 2)}"></strong></td>
          <td>
            <span th:if="${appt.status == 'CONFIRMED'}" class="tag tag-green" th:text="${appt.status}"></span>
            <span th:unless="${appt.status == 'CONFIRMED'}" class="tag tag-gray" th:text="${appt.status}"></span>
          </td>
          <td>
            <span th:if="${appt.machineReady}" class="tag tag-green">Ready</span>
            <form th:unless="${appt.machineReady}"
                  th:action="@{/technician/ready/{id}(id=${appt.appointmentId})}"
                  method="post" style="display:inline;">
              <button type="submit" class="btn-accent"
                      style="font-size:0.75rem;padding:5px 14px;">Mark Ready</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="action-row">
    <a class="btn-outline" href="/">Home</a>
  </div>
</div>

<footer class="bs-footer">BeagleScheduler &mdash; CMPE172 Project</footer>
</body>
</html>
