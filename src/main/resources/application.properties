spring.application.name=CMPE172Project
server.port=8080
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# Logging — console output
logging.level.com.beaglescheduler.cmpe172project=DEBUG

# Show every HTTP request dispatched to Spring MVC
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Spring Security — show filter chain decisions, auth events, access denied
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.authentication=DEBUG

# SQL — show every query and bind parameters
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Thymeleaf template resolution
logging.level.org.thymeleaf=INFO

# File log (keep it too)
logging.file.name=logs/beagle-scheduler.log

# Console pattern: timestamp  level  logger — message
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] %msg%n
